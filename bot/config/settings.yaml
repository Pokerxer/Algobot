account:
  starting_balance: 1500
  max_daily_drawdown_pct: 5
  max_concurrent_positions: 5
  risk_per_trade_pct: 1.5

# US30m removed — 0.92 correlation with US500m wastes a concurrent-position slot
# EURUSDm kept here but routed to mean-reversion only inside bot logic
instruments: [EURUSDm, GBPUSDm, GBPJPYm, USDJPYm, XAUUSDm, US500m, USTECm, BTCUSDm, ETHUSDm]

timeframes:
  regime: H1
  entry: M15

regime:
  adx_period: 14
  adx_trend_threshold: 28
  adx_range_threshold: 20
  bb_period: 20
  bb_std: 2

strategy:
  momentum:
    fast_ema: 20
    slow_ema: 50
    atr_stop_multiplier: 2.0    # 33% more room — fewer noise stop-outs
    atr_target_multiplier: 4.0  # 2:1 R/R maintained with wider stop
    rsi_period: 14
    rsi_midline: 40.0           # allows genuine pullback entries (RSI 40–60 zone)

  mean_reversion:
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    bb_std: 2.0
    require_double_touch: false
    require_divergence: false
    bb_expansion_filter: true   # skip if bands are widening (volatility spike)

  london_breakout:
    session_start_utc: 7
    session_end_utc: 10
    tp_multiplier: 1.5
    min_range_pips: 10.0
    pairs:
      - EURUSDm
      - GBPUSDm
      - USDJPYm

ai:
  enabled: false   # disabled until the AI validator is finished; bot runs on rules only
  confidence_threshold: 0.6
  timeout_seconds: 30
  max_calls_per_day: 50
  model: claude-sonnet-4-6

execution:
  max_holding_hours: 24
  max_spread_multiplier: 2.0
